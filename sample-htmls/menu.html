<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu — Foundry Artisan Coffee</title>
<meta name="description" content="Coffee, tea, brunch and bagels at Foundry Artisan Coffee, Indooroopilly Shopping Centre. Tap any item for sizes, prices and options.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f3f0e1; --paper-2:#eae5d2; --ink:#1b1915; --muted:#6e6a5a;
  --rule:#dbd5c0; --olive:#5a6b4b; --espresso:#3b2a1e;
  --sheet-max:520px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:17px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
a{color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 22px}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;background:var(--paper);
  border-bottom:1px solid var(--rule);
}
.topbar-in{display:flex;align-items:center;justify-content:space-between;height:60px}
.brand img{height:26px;display:block}
.back{
  font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;
  text-decoration:none;color:var(--muted)
}
.back:hover{color:var(--ink)}

/* ---------- page head ---------- */
h1{
  font-family:"Playfair Display",Georgia,serif;font-weight:900;
  font-size:clamp(44px,13vw,72px);line-height:.95;margin:34px 0 14px;letter-spacing:-.01em;
}
.lede{color:var(--muted);max-width:42ch;margin:0 0 26px}

/* ---------- tabs ---------- */
.tabs{
  position:sticky;top:60px;z-index:30;background:var(--paper);
  padding:12px 0 14px;display:flex;gap:10px;
}
.tab{
  font:inherit;font-weight:600;cursor:pointer;
  padding:11px 30px;border-radius:999px;border:1px solid var(--ink);
  background:transparent;color:var(--ink);
}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.tab:focus-visible{outline:2px solid var(--olive);outline-offset:3px}

/* ---------- sections ---------- */
.sec{margin:30px 0 4px}
.sec-head{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.sec-head h2{
  font-size:14px;letter-spacing:.18em;text-transform:uppercase;
  font-weight:600;color:var(--muted);margin:0;white-space:nowrap;
}
.sec-head .rule{flex:1;height:1px;background:var(--rule)}
.sec-note{color:var(--muted);font-size:14px;margin:2px 0 0}

.cols{display:flex;justify-content:flex-end;gap:0;color:var(--muted);
  font-size:13px;letter-spacing:.12em;padding:10px 0 2px}
.cols span{width:56px;text-align:right}

.row{
  width:100%;display:flex;align-items:baseline;gap:8px;text-align:left;
  background:none;border:0;border-bottom:1px solid var(--rule);
  padding:15px 0;font:inherit;color:inherit;cursor:pointer;
}
.row:last-child{border-bottom:0}
.row:hover .name,.row:focus-visible .name{color:var(--espresso)}
.row:focus-visible{outline:2px solid var(--olive);outline-offset:2px}
.name{font-weight:500;white-space:nowrap}
.leader{flex:1;border-bottom:1.5px dotted var(--rule);transform:translateY(-4px);min-width:14px}
.prices{display:flex;gap:0}
.prices span{width:56px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.prices .na{color:var(--rule);font-weight:400}

.plain{border-bottom:1px solid var(--rule);padding:15px 0;display:flex;
  justify-content:space-between;gap:14px;color:var(--muted)}
.plain:last-child{border-bottom:0}

footer.page{border-top:1px solid var(--rule);margin-top:46px;padding:26px 0 60px;
  color:var(--muted);font-size:14px}

/* ---------- product page ---------- */
.product{
  position:fixed;inset:0;z-index:60;background:var(--paper);overflow:auto;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.7,.3,1);
}
.product.on{transform:translateY(0)}
.pbar{
  position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--rule);
  height:56px;display:flex;align-items:center;gap:12px;padding:0 12px;
}
.pback{
  display:flex;align-items:center;gap:8px;background:none;border:0;cursor:pointer;
  font:inherit;font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;
  color:var(--ink);padding:9px 14px;border-radius:999px;
}
.pback:hover{background:var(--paper-2)}
.pback:focus-visible{outline:2px solid var(--olive);outline-offset:2px}
.crumb{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbody{max-width:980px;margin:0 auto;padding:0 22px 40px}

.art{
  background:var(--paper-2);border-radius:18px;display:grid;place-items:center;
  padding:24px;margin:18px 0 24px;min-height:250px;
}
.art{--h:clamp(150px,40vw,230px)}
.art[data-sz="0"]{--h:clamp(124px,33vw,188px)}
.art[data-sz="1"]{--h:clamp(150px,40vw,228px)}
.art[data-sz="2"]{--h:clamp(174px,47vw,268px)}
.art svg{height:var(--h);width:auto;color:var(--ink);
  transition:height .28s cubic-bezier(.2,.7,.3,1)}

.product h3{font-family:"Playfair Display",Georgia,serif;font-weight:700;
  font-size:clamp(30px,7vw,40px);line-height:1.08;margin:0 0 8px}
.product .desc{color:var(--muted);margin:0 0 4px;max-width:52ch}

.group{margin:28px 0 0;padding-top:22px;border-top:1px solid var(--rule)}
.group h4{font-size:12px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--muted);font-weight:600;margin:0 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;width:100%;height:100%;left:0;top:0;margin:0;cursor:pointer}
.chip > span{
  display:block;padding:10px 16px;border:1px solid var(--rule);border-radius:999px;
  font-size:15px;background:rgba(255,255,255,.55);
  transition:background .15s,border-color .15s,color .15s;
}
.chip input:checked + span{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip input:focus-visible + span{outline:2px solid var(--olive);outline-offset:2px}
.chip .add{opacity:.6;font-size:13px;margin-left:6px}

/* size picker — cups step up in size, like the Starbucks row */
.sizes{display:flex;gap:4px;align-items:flex-end;flex-wrap:wrap}
.size{position:relative;flex:1;min-width:88px}
.size input{position:absolute;opacity:0;width:100%;height:100%;left:0;top:0;margin:0;cursor:pointer}
.size > span{
  display:flex;flex-direction:column;align-items:center;gap:2px;justify-content:flex-end;
  padding:12px 6px 12px;border-bottom:2px solid transparent;border-radius:12px 12px 0 0;
  transition:background .15s,border-color .15s;
}
.size > span .cupicon{color:var(--muted);transition:color .15s;display:block}
.size .cupicon svg{display:block;width:auto;margin:0 auto}
.size:hover > span{background:var(--paper-2)}
.size input:checked + span{border-bottom-color:var(--ink);background:var(--paper-2)}
.size input:checked + span .cupicon{color:var(--ink)}
.size input:focus-visible + span{outline:2px solid var(--olive);outline-offset:2px}
.size .sz{font-weight:600;font-size:15px;margin-top:8px}
.size .vol{font-size:12px;color:var(--muted)}
.size .pr{font-size:14px;font-variant-numeric:tabular-nums;margin-top:2px}

.totalbar{
  position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--rule);
  margin-top:30px;padding:14px 0 18px;display:flex;align-items:center;
  justify-content:space-between;gap:16px;
}
.totalbar .lab{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
  display:block}
.totalbar .amt{font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:30px;
  font-variant-numeric:tabular-nums;line-height:1.1}
.totalbar .counter{color:var(--muted);font-size:13px;margin:0;max-width:24ch;text-align:right}
.allergen{color:var(--muted);font-size:14px;margin:18px 0 0}

@media (min-width:880px){
  .pbody{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    column-gap:48px;align-items:start;padding-bottom:60px}
  .art{position:sticky;top:80px;margin-top:26px;min-height:420px}
  .pdetail{padding-top:26px}
  .totalbar{position:static;border-top:1px solid var(--rule)}
}
@media (prefers-reduced-motion:reduce){
  .product,.art svg{transition:none}
}
</style>
</head>

--------------------------------------------------------------- */

    '<path d="M50 26c-6-5 2-9-2-14M66 26c-6-5 2-9-2-14" opacity=".4"/></g>',
  demitasse: G +
    '<path d="M40 50h40l-5 34a9 9 0 0 1-9 8H54a9 9 0 0 1-9-8z"/>' +
    '<path d="M80 58c10 0 12 16 1 18"/>' +
    '<path d="M44 60h32"/>' +

  plate: G +

    '<ellipse cx="63" cy="72" rx="17" ry="13"/>' +

var DEMI = ['Short macchiato','Long macchiato','Espresso','Doppio','Piccolo','Affogato','Babycino'];
var SECART = {'Hot coffee':'mug','Iced coffee':'glass','Hot drinks':'mug','Tea lovers':'mug',
              'Sweet tooth':'glass','Shakes and frappes':'shake'};

function cup(sec, item, h){
  var type = DEMI.indexOf(item.n) > -1 ? 'demitasse' : (SECART[sec.title] || 'plate');
  var box = h ? ' height="' + h + '"' : '';
  return '<svg viewBox="0 0 120 120"' + box + ' aria-hidden="true">' + ART[type] + '</svg>';
}

/* ---------------------------------------------------------------
   RENDER LIST
--------------------------------------------------------------- */
function price(v){
  var s = v.toFixed(2);
  if (s.slice(-1) === '0') s = s.slice(0,-1);   // 6.80 -> 6.8, 6.00 -> 6.0
  return s;
}

function build(list, host){
  list.forEach(function(sec, si){
    var el = document.createElement('section');
    el.className = 'sec';
    var head = '<div class="sec-head"><h2>' + sec.title + '</h2><span class="rule"></span></div>';
    if (sec.note) head += '<p class="sec-note">' + sec.note + '</p>';
    if (sec.cols && sec.cols.length){
      head += '<div class="cols">' + sec.cols.map(function(c){ return '<span>' + c + '</span>'; }).join('') + '</div>';
    }
    var rows = sec.items.map(function(it, ii){
      var cells;
      if (sec.cols && sec.cols.length){
        cells = it.p.map(function(v){
          return v === null ? '<span class="na">&mdash;</span>' : '<span>' + price(v) + '</span>';
        }).join('');
      } else {
        cells = '<span>' + price(it.p[0]) + '</span>';
      }
      return '<button class="row" data-g="' + host.id + '" data-s="' + si + '" data-i="' + ii + '">' +
             '<span class="name">' + it.n + '</span><span class="leader"></span>' +
             '<span class="prices">' + cells + '</span></button>';
    }).join('');
    el.innerHTML = head + rows;
    host.appendChild(el);
  });
}

var GROUPS = {'panel-drinks':DRINKS, 'panel-food':FOOD};
build(DRINKS, document.getElementById('panel-drinks'));
build(FOOD, document.getElementById('panel-food'));

/* ---------------------------------------------------------------
   TABS
--------------------------------------------------------------- */
var tabD = document.getElementById('tab-drinks'), tabF = document.getElementById('tab-food');
function show(which){
  var d = which === 'drinks';
  tabD.setAttribute('aria-selected', d); tabF.setAttribute('aria-selected', !d);
  document.getElementById('panel-drinks').hidden = !d;
  document.getElementById('panel-food').hidden = d;
}
tabD.addEventListener('click', function(){ show('drinks'); location.hash = 'drinks'; });
tabF.addEventListener('click', function(){ show('food'); location.hash = 'food'; });
if (location.hash === '#food') show('food');

/* ---------------------------------------------------------------
   DETAIL SHEET
--------------------------------------------------------------- */
var product = document.getElementById('product'),
    pBody = document.getElementById('pBody'),
    pCrumb = document.getElementById('pCrumb'),
    pBack = document.getElementById('pBack'),
    lastFocus = null;

var ICON_H = [30, 38, 47];   // cup icons step up across the size row

function openItem(sec, item, group){
  var sizeLabels = (sec.cols && sec.cols.length) ? sec.cols : [];
  var crumb = (group === 'panel-food' ? 'Food' : 'Drinks') + '  ›  ' + sec.title;
  pCrumb.textContent = crumb;

  var html = '<div class="art" id="pArt" data-sz="1">' + cup(sec, item) + '</div>' +
             '<div class="pdetail">' +
             '<h3 id="pTitle">' + item.n + '</h3>';
  if (item.d) html += '<p class="desc">' + item.d + '</p>';

  if (sizeLabels.length){
    var avail = [];
    sizeLabels.forEach(function(lab, i){
      if (item.p[i] !== null && item.p[i] !== undefined) avail.push({lab:lab, price:item.p[i]});
    });
    html += '<div class="group"><h4>Size</h4><div class="sizes">';
    var IDX = {S:0, M:1, L:2};
    avail.forEach(function(s, i){
      var idx = IDX[s.lab] === undefined ? 1 : IDX[s.lab];
      var h = ICON_H[idx];
      html += '<label class="size"><input type="radio" name="size" value="' + s.price +
              '" data-idx="' + idx + '"' + (i === 0 ? ' checked' : '') + '>' +
              '<span><span class="cupicon">' + cup(sec, item, h) + '</span>' +
              '<span class="sz">' + s.lab + '</span>' +
              '<span class="vol">' + (VOL[s.lab] || '') + '</span>' +
              '<span class="pr">$' + s.price.toFixed(2) + '</span></span></label>';
    });
    html += '</div></div>';
  } else {
    html += '<div hidden><input type="radio" name="size" value="' + item.p[0] + '" data-idx="1" checked></div>';
  }

  (item.o || []).forEach(function(g, gi){
    html += '<div class="group"><h4>' + g.name + '</h4><div class="chips">';
    g.opts.forEach(function(o, oi){
      var type = g.type === 'one' ? 'radio' : 'checkbox';
      var checked = (g.type === 'one' && oi === 0) ? ' checked' : '';
      html += '<label class="chip"><input type="' + type + '" name="g' + gi + '" value="' + o.p + '"' + checked + '>' +
              '<span>' + o.l + (o.p ? '<span class="add">+$' + o.p.toFixed(2) + '</span>' : '') + '</span></label>';
    });
    html += '</div></div>';
  });

  html += '<p class="allergen">Made to order. Allergen and dietary information is available at the counter.</p>' +
          '<div class="totalbar"><span><span class="lab">Your ' + item.n.toLowerCase() + '</span>' +
          '<span class="amt" id="amt">$0.00</span></span>' +
          '<p class="counter">Order at the counter — we don\'t take online orders yet.</p></div>' +
          '</div>';

  pBody.innerHTML = html;
  recalc();

  lastFocus = document.activeElement;
  product.hidden = false;
  document.body.style.overflow = 'hidden';
  requestAnimationFrame(function(){ product.classList.add('on'); });
  product.scrollTop = 0;
  pBack.focus();
}

function recalc(){
  var total = 0;
  var size = pBody.querySelector('input[name="size"]:checked');
  if (size){
    total += parseFloat(size.value);
    var art = document.getElementById('pArt');
    if (art) art.dataset.sz = size.dataset.idx;
  }
  pBody.querySelectorAll('input:checked').forEach(function(el){
    if (el.name !== 'size') total += parseFloat(el.value) || 0;
  });
  var amt = document.getElementById('amt');
  if (amt) amt.textContent = '$' + total.toFixed(2);
}

function closeProduct(){
  product.classList.remove('on');
  document.body.style.overflow = '';
  setTimeout(function(){ product.hidden = true; pBody.innerHTML = ''; }, 280);
  if (lastFocus) lastFocus.focus();
}

document.addEventListener('click', function(e){
  var row = e.target.closest('.row');
  if (row){
    var sec = GROUPS[row.dataset.g][+row.dataset.s];
    openItem(sec, sec.items[+row.dataset.i], row.dataset.g);
  }
});
pBody.addEventListener('change', recalc);
pBack.addEventListener('click', closeProduct);
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && !product.hidden) closeProduct();
  if (e.key === 'Tab' && !product.hidden){
    var f = product.querySelectorAll('button, input, [href]');
    if (!f.length) return;
    var first = f[0], last = f[f.length-1];
    if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }
});
</script>
