name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

jobs:
  build:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
        # Add `cache: "npm"` here once a package-lock.json is committed.
        # The cache step needs the lockfile to compute its key.

      - name: Install dependencies
        # `npm install` (not `npm ci`) because there is no package-lock.json yet
        # — the repo forbids local installs, so the lockfile is generated here
        # first. Commit the lockfile after the first green run, then switch
        # this to `npm ci` for fully reproducible installs.
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build (typecheck + production build)
        # The admin pages construct the Supabase browser client while
        # prerendering, so the public env vars must be present at build time.
        # These are publishable values — add them as repo secrets.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://rgybafsqexxouyvaxxwa.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_biR7fyJ3FGPmt40dHI8wUQ_P6howGpJ' }}
        run: npm run build

      - name: Upload static export artifact
        uses: actions/upload-artifact@v7
        with:
          name: foundry-artisan-coffee-static-files
          path: out
          retention-days: 14
