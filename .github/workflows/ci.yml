name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

jobs:
  build:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (typecheck + production build)
        # The admin pages construct the Supabase browser client while
        # prerendering, so the public env vars must be present at build time.
        # Default fallbacks are also baked into utils/supabase/client.ts.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Upload static export artifact
        uses: actions/upload-artifact@v7
        with:
          name: foundry-artisan-coffee-static-files
          path: out
          retention-days: 14
