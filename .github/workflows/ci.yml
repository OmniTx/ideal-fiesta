name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

jobs:
  build:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Derive build label
        # Short commit SHA prefixes the artifact, matching the local export
        # convention: <sha>-foundry-artisan-coffee-static.zip
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        # Explicit --include=dev: with NODE_ENV=production npm ci silently skips
        # devDependencies, so tailwindcss/typescript go missing and the build
        # dies with "Cannot find module 'tailwindcss'".
        run: npm ci --include=dev

      - name: Lint
        run: npm run lint

      - name: Build (typecheck + production build)
        # The admin pages construct the Supabase browser client while
        # prerendering, and the client throws if these are missing — the
        # build needs the publishable env vars. Add them as repo secrets.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Upload static export artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SHORT_SHA }}-foundry-artisan-coffee-static
          path: out
          retention-days: 14
